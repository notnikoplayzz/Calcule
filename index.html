<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALCULE LEGENDS</title>

<style>
:root{
  --bg:#070914;
  --bg2:#0d1020;
  --card:#11162a;
  --card2:#171d35;
  --text:#f5f7ff;
  --muted:#8f98b8;
  --primary:#7c5cff;
  --primary2:#a78bfa;
  --cyan:#19d3ff;
  --green:#32e875;
  --red:#ff4f6d;
  --yellow:#ffd166;
  --border:rgba(255,255,255,.09);
  --shadow:0 20px 60px rgba(0,0,0,.4);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  height:100%; /* Forțează fundalul să ocupe tot ecranul pentru centrare */
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 20% 10%,rgba(124,92,255,.18),transparent 30%),
    radial-gradient(circle at 80% 20%,rgba(25,211,255,.12),transparent 25%),
    var(--bg);
  color:var(--text);
}

body{
  overflow-x:hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

button{
  font:inherit;
}

/* Stil reparat pentru centrare verticală și orizontală absolută */
.screen.active {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100vw;
  height: 100vh;
}

.container.center {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}

.card{
  background:linear-gradient(145deg,rgba(20,26,48,.96),rgba(10,14,28,.96));
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:var(--shadow);
}

.btn{
  border:0;
  border-radius:15px;
  padding:14px 20px;
  color:white;
  background:#202742;
  cursor:pointer;
  transition:.2s;
  font-weight:800;
}

.btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.12);
}

.btn:active{
  transform:translateY(0);
}

.primary{
  background:linear-gradient(135deg,var(--primary),#5c42dc);
}

.big-btn{
  width:100%;
  font-size:19px;
  padding:18px;
}

.secondary{
  background:#1b223b;
}

.danger{
  background:linear-gradient(135deg,#ff3d62,#c92748);
}

.success{
  background:linear-gradient(135deg,#19c966,#0c9e4e);
}

.back{
  margin-bottom:20px;
}

h1,h2,h3{
  line-height:1.1;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.logo{
  font-size:clamp(38px,7vw,72px);
  font-weight:1000;
  letter-spacing:-3px;
  text-align:center;
  background:linear-gradient(90deg,#fff,var(--primary2),var(--cyan));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin-top:10px;
}

/* INTRO */

#introSplash{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#05060d;
}

#introSplash.show{
  display:flex;
}

.intro-content{
  padding:30px;
}

.intro-small{
  color:var(--muted);
  font-weight:800;
  letter-spacing:5px;
  margin-bottom:15px;
}

.intro-big{
  font-size:clamp(42px,9vw,100px);
  font-weight:1000;
  letter-spacing:-5px;
}

.intro-made{
  margin-top:25px;
  color:var(--muted);
}

.intro-name{
  margin-top:8px;
  color:var(--cyan);
  font-size:25px;
  font-weight:900;
}

/* HOME */

.home-box{
  width:min(560px,100%);
  padding:35px;
  text-align:center;
}

.home-title{
  font-size:clamp(35px,8vw,62px);
  font-weight:1000;
  letter-spacing:-3px;
}

.home-version{
  margin:10px 0 30px;
  color:var(--muted);
}

/* MENU */

.menu-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:25px;
}

.menu-btn{
  min-height:110px;
  text-align:left;
  padding:22px;
}

.menu-icon{
  font-size:35px;
  margin-bottom:10px;
}

.menu-title{
  font-size:19px;
  font-weight:900;
}

.menu-desc{
  color:var(--muted);
  margin-top:5px;
  font-size:13px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.topbar h2{
  font-size:30px;
}

.currency{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.pill{
  background:#151b31;
  border:1px solid var(--border);
  padding:9px 13px;
  border-radius:999px;
  font-weight:800;
}

/* MODES */

.option-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.option{
  padding:25px;
  cursor:pointer;
}

.option:hover{
  border-color:rgba(124,92,255,.6);
}

.option h3{
  font-size:23px;
  margin-bottom:8px;
}

.option p{
  color:var(--muted);
  line-weight:1.5;
}

.option .icon{
  font-size:38px;
  margin-bottom:15px;
}

/* DIFFICULTY */

.diff-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:20px;
}

.diff{
  padding:25px;
  text-align:center;
  cursor:pointer;
}

.diff.easy{
  border-color:rgba(50,232,117,.3);
}

.diff.medium{
  border-color:rgba(255,209,102,.3);
}

.diff.hard{
  border-color:rgba(255,79,109,.3);
}

.diff h3{
  margin:12px 0 7px;
}

/* SHOP */

.shop-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.shop-item{
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:15px;
}

.shop-header{
  display:flex;
  align-items:center;
  gap:15px;
}

.shop-icon{
  font-size:40px;
}

/* CAMPAIGN */

.world-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:20px;
}

.world{
  padding:22px;
  cursor:pointer;
}

.world:hover{
  border-color:var(--primary);
}

.world.locked{
  opacity:.45;
  cursor:not-allowed;
}

.world-number{
  color:var(--primary2);
  font-weight:900;
  margin-bottom:10px;
}

.level-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:20px;
}

.level{
  padding:15px 8px;
  text-align:center;
  border-radius:14px;
  border:1px solid var(--border);
  background:#12182d;
  cursor:pointer;
  font-weight:900;
}

.level:hover{
  border-color:var(--primary);
}

.level.locked{
  opacity:.35;
  cursor:not-allowed;
}

.level.done{
  border-color:var(--green);
}

/* GAME */

.game-wrap{
  width:min(800px,100%);
  margin:auto;
}

.game-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.game-stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.question-card{
  padding:30px;
  text-align:center;
}

.question-label{
  color:var(--muted);
  font-size:14px;
  margin-bottom:20px;
}

.question{
  font-size:clamp(50px,12vw,100px);
  font-weight:1000;
  margin-bottom:25px;
}

.answer-row{
  display:flex;
  gap:10px;
}

.answer-input{
  flex:1;
  min-width:0;
  background:#080c19;
  border:2px solid var(--border);
  color:white;
  padding:17px;
  border-radius:14px;
  font-size:25px;
  text-align:center;
  outline:none;
}

.answer-input:focus{
  border-color:var(--primary);
}

.answer-btn{
  padding:17px 25px;
}

.progress{
  height:9px;
  background:#090d19;
  border-radius:999px;
  overflow:hidden;
  margin-top:20px;
}

.progress-bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--primary),var(--cyan));
  transition:.2s;
}

.feedback{
  min-height:32px;
  margin-top:18px;
  font-weight:900;
  font-size:18px;
}

.feedback.correct{
  color:var(--green);
}

.feedback.wrong{
  color:var(--red);
}

.timer{
  color:var(--yellow);
  font-size:22px;
  font-weight:1000;
}

/* PROFILE / STATS */

.profile-card{
  padding:30px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--primary);
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:20px;
}

.stat{
  background:#0c1122;
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
}

.stat-value{
  font-size:28px;
  font-weight:1000;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

/* RECORDS */

.list{
  display:grid;
  gap:10px;
  margin-top:20px;
}

.list-item{
  padding:18px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

/* SETTINGS */

.setting{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-top:12px;
}

.switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}
</style>
</head>
<body>

  <!-- INTERFAȚA HOME ALINIATĂ PERFECT PE MIJLOC -->
  <div class="screen active center">
    <div class="container center">
      <div class="card home-box">
        
        <h1 class="home-title logo">CALCULE LEGENDS</h1>
        <p class="home-version subtitle">Versiunea 1.0</p>
        
        <button class="btn primary big-btn" onclick="startIntro()">JOACĂ ACUM</button>
      </div>
    </div>
  </div>

  <script>
    // Butonul apelează direct funcția ta din codul vechi fără să mai schimbe textul
    function startIntro() {
        // Când vei adăuga codul original de 1400 de linii, logica de pornire se va executa direct aici
        console.log("Funcția startIntro a fost apelată.");
    }
  </script>
</body>
</html>
